<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi các bạn nữ 12a1💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
        --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }
      .g1 {
        width: 50vmax;
        height: 50vmax;
        background: #ff2d8a;
        left: -15vmax;
        top: -10vmax;
      }
      .g2 {
        width: 40vmax;
        height: 40vmax;
        background: #8a3dff;
        right: -12vmax;
        bottom: -10vmax;
      }
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      @keyframes tw {
        from {
          opacity: 0.1;
        }
        to {
          opacity: 0.9;
          box-shadow: 0 0 8px #fff;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 1s,
          transform 1s;
        z-index: 2;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(1.9rem, 8.5vw, 4rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.6rem, 12vw, 5.8rem);
        color: var(--pink);
        text-shadow: 0 0 30px var(--rose);
      }
      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.6s;
      }
      @keyframes pop {
        0% {
          transform: scale(1.6);
          filter: brightness(2.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 14px var(--rose);
        will-change: transform;
        transition: opacity 1s;
      }
      #hint {
        font-family: var(--script);
        font-size: 1.6rem;
        color: var(--gold);
        animation: pulse 1.6s infinite;
        margin-top: 1rem;
        text-align: center;
        padding: 0 1rem;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.05);
        }
      }
      #btn,
      .b2 {
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
        transition: transform 0.2s;
        z-index: 5;
      }
      #btn:hover,
      .b2:hover {
        transform: scale(1.07);
      }
      .b2.ghost {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        border: 1px solid rgba(255, 182, 213, 0.5);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 1.5rem 1.1rem 1.1rem;
        border-radius: 24px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1px solid rgba(255, 182, 213, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 25px 90px rgba(255, 61, 132, 0.35),
          inset 0 0 40px rgba(255, 150, 200, 0.08);
        transform: scale(0.85) translateY(30px);
        transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
      }
      #card.show .box {
        transform: none;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 99px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
        box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
      }
      .big {
        font-size: 2.1rem;
        margin: 0.4rem 0 0;
        animation: beat 1.2s infinite;
      }
      @keyframes beat {
        15% {
          transform: scale(1.25);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        margin: 0 0 0.2rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #ff9ec8
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1rem;
      }
      .orn:before,
      .orn:after {
        content: "";
        height: 1px;
        width: 22%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }
      #msg {
        font-weight: 300;
        font-size: 0.88rem;
        line-height: 1.7;
        min-height: 6.4em;
        margin: 0 0.3rem;
      }
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }
      .w {
        padding: 0.55rem 0.45rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 213, 0.25);
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: 1.1rem;
        color: var(--gold);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        transition: opacity 1s;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.7));
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.9s ease-out forwards;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }
      * {
        cursor: none !important;
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99;
        pointer-events: none;
        font-size: 26px;
        color: #ff3d84;
        text-shadow:
          0 0 12px #ff3d84,
          0 0 28px #ff6fae;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #cur span {
        display: inline-block;
        animation: beat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 98;
        pointer-events: none;
        color: #ff6fae;
        transform: translate(-50%, -50%);
        animation: tr 1.1s ease-out forwards;
        text-shadow: 0 0 8px rgba(255, 61, 132, 0.8);
      }
      @keyframes tr {
        to {
          transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
          opacity: 0;
        }
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }

      /* 🎵 Nút bật/tắt nhạc */
      .music {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 14px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.5rem 0.95rem 0.5rem 0.8rem;
        border-radius: 99px;
        border: 1px solid rgba(255, 182, 213, 0.5);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.05)
        );
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #ffd9e8;
        font: 600 0.78rem var(--sans);
        letter-spacing: 0.04em;
        box-shadow: 0 0 22px rgba(255, 61, 132, 0.35);
        transition:
          transform 0.2s,
          box-shadow 0.3s,
          background 0.3s;
      }
      .music:hover {
        transform: scale(1.06);
      }
      .music:active {
        transform: scale(0.96);
      }
      /* chưa phát: viền nhấp nháy nhắc bấm */
      .music:not(.on):not(.off) {
        animation: ring 1.8s infinite;
      }
      @keyframes ring {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 111, 174, 0.6);
        }
        100% {
          box-shadow: 0 0 0 14px rgba(255, 111, 174, 0);
        }
      }
      .music.on {
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 0 26px rgba(255, 61, 132, 0.6);
      }
      .eq {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 16px;
      }
      .eq i {
        display: block;
        width: 3px;
        height: 4px;
        border-radius: 2px;
        background: currentColor;
        transition: height 0.3s;
      }
      .music.on .eq i {
        animation: eq 0.9s ease-in-out infinite alternate;
      }
      .music.on .eq i:nth-child(1) { animation-delay: -0.2s; }
      .music.on .eq i:nth-child(2) { animation-delay: -0.6s; }
      .music.on .eq i:nth-child(3) { animation-delay: -0.1s; }
      .music.on .eq i:nth-child(4) { animation-delay: -0.45s; }
      @keyframes eq {
        from { height: 3px; }
        to { height: 16px; }
      }
      /* nút tròn nhỏ, chỉ có biểu tượng */
      .mlabel { display: none; }
      .music {
        width: 44px;
        height: 44px;
        padding: 0;
        justify-content: center;
      }
      /* đang tắt: gạch chéo */
      .music.off::after {
        content: "";
        position: absolute;
        width: 26px;
        height: 2px;
        border-radius: 2px;
        background: #ffd9e8;
        transform: rotate(-45deg);
        box-shadow: 0 0 6px rgba(255, 61, 132, 0.8);
      }
      .music.off .eq { opacity: 0.55; }

      /* 🤖 ROBOT + THỬ THÁCH */
      #bot{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(circle at 50% 35%,#3a1260,#140a2e 75%);opacity:0;transition:opacity .8s;
        font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;color:#fff}
      #bot.show{opacity:1}
      #dots{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:8px}
      #dots span{width:9px;height:9px;border-radius:9px;background:rgba(120,255,255,.25);transition:all .4s}
      #dots .done{background:#6ff}#dots .cur{width:34px;background:#6ff;box-shadow:0 0 12px #6ff}
      #skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:none;border:1px solid rgba(120,255,255,.35);
        color:#aff;border-radius:99px;padding:.3rem .8rem;font:inherit;font-size:.75rem;cursor:pointer;z-index:3}
      #arena{position:absolute;inset:0;z-index:1;overflow:hidden}
      #botc{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;pointer-events:none;width:min(92vw,380px)}
      .eyes{display:flex;align-items:center;gap:34px;height:70px}
      .eyes i{display:block;width:66px;height:66px;border-radius:22px;background:linear-gradient(#8ff,#2bd);
        box-shadow:0 0 34px #3ef8;transition:all .35s;animation:blink 5s infinite}
      @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
      .eyes.happy i{height:28px;border-radius:50% 50% 8px 8px/100% 100% 8px 8px;animation:none}
      .eyes.sad i{height:34px;border-radius:8px 8px 50% 50%/8px 8px 100% 100%;animation:none}
      .eyes.sad i:first-child{transform:rotate(-10deg)}.eyes.sad i:last-child{transform:rotate(10deg)}
      .eyes.love i{background:none;box-shadow:none;width:auto;height:auto;font-size:58px;line-height:1;animation:none}
      .eyes.love i::before{content:"❤";color:#ff6fae;text-shadow:0 0 20px #ff3d84}
      .blush{display:flex;gap:44px;height:22px;margin-top:6px;color:#ff5f9a;opacity:0;transition:opacity .4s;letter-spacing:2px}
      #say{margin-top:14px;text-align:center;font-size:1.05rem;line-height:1.6;min-height:5.2em}
      #say.in{animation:sayin .5s}
      @keyframes sayin{from{opacity:0;transform:translateY(8px)}}
      #say b{color:#7fffb0}
      .wc{margin-top:26px;font-size:.9rem;color:#8ff}
      #ctl{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px;min-height:150px;pointer-events:auto}
      .gb{padding:.8rem 1.3rem;border-radius:16px;border:1px solid rgba(120,255,255,.5);background:rgba(120,255,255,.1);
        color:#dff;font:inherit;font-size:.95rem;cursor:pointer;touch-action:manipulation}
      .gb:active{background:rgba(120,255,255,.3)}
      .gb.run{position:absolute;transition:left .25s,top .25s}
      .gs{position:absolute;color:#ffd76a;text-shadow:0 0 18px #ffb830;cursor:pointer;animation:bob 2.4s ease-in-out infinite alternate;touch-action:manipulation}
      @keyframes bob{to{transform:translateY(-14px) rotate(12deg)}}
      .gs.pop{animation:none;transform:scale(2);opacity:0;transition:all .3s}
      .pads{display:grid;grid-template-columns:repeat(2,64px);gap:12px}
      .pad{width:64px;height:64px;border:0;border-radius:18px;background:var(--c);opacity:.3;transition:opacity .15s,box-shadow .15s;cursor:pointer}
      .pad.lit{opacity:1;box-shadow:0 0 28px var(--c)}
      .bar{width:200px;height:10px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
      .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6ff,#ff6fae)}
    </style>
  </head>
  <body>
    <!-- 🎵 NHẠC NỀN: đổi đường dẫn src cho đúng thư mục/tên file mp3 của bạn -->
    <audio id="bgm" loop preload="auto"></audio>
    <button id="mute" class="music" type="button" aria-label="Bật/tắt nhạc" title="Bật/tắt nhạc">
      <span class="eq"><i></i><i></i><i></i><i></i></span>
      <span class="mlabel">Nhạc</span>
    </button>

    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">૮₍ ˃ ⤙ ˂ ₎ა</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg">•ﻌ•     </div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          <small>nhấn phím Space để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <div id="bot">
      <div id="dots"><span></span><span></span><span></span><span></span><span></span></div>
      <button id="skip" type="button">bỏ qua ›</button>
      <div id="arena"></div>
      <div id="botc">
        <div class="eyes" id="eyes"><i></i><i></i></div>
        <div class="blush" id="blush"><span>////</span><span>////</span></div>
        <div id="say"></div>
        <div id="ctl"></div>
      </div>
    </div>

    <script>
      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "các bạn nữ 12a1",
        name: "các bạn nữ 12a1",
        intro:
          "Nhân ngày 20/10, chúc các cậu luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của cậu đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
        wishes: [
          ["(˶˃ ᵕ ˂˶)", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
          ["(˵˃ ᗜ ˂˵)", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
          ["(˶ᵔ ᵕ ᵔ˶) ‹𝟹", "Bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
          ["(˶ˆᗜˆ˵)", "Được yêu thương", "Nhiều hơn bạn có thể đếm hết."],
        ],
        quote:
          "Cảm ơn cậu vì đã xuất hiện và làm thế giới của tớ dịu dàng hơn rất nhiều.",
        sign: "— Dương 🌹",
      };
      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
        )
        .join("");

      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;
      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
        // chữ thật
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
        // chữ gây nhiễu bay lung tung
        for (let i = 0; i < 34; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }
      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd([
          "#ffb3d4",
          "#ff6fae",
          "#ffd9a8",
          "#e0b3ff",
          "#fff",
        ]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.6, 2.6),
          vy: R(-2.6, 2.6),
          rot: R(0, 360),
          vr: R(-4, 4),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }
      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.2;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
              land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }
      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công";
          heartStorm();
          setTimeout(startBot, 1800);
        }
      }
      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4)
              f.el.textContent = rnd(POOL);
          }),
        150,
      );

      // 🎵 Phát nhạc (trình duyệt chỉ cho phát sau khi người dùng bấm/chạm)
      const bgm = $("bgm"),
        muteBtn = $("mute");
      // 👉 Đổi đường dẫn nhạc ở đây (encodeURI xử lý dấu cách + tiếng Việt)
      const MUSIC_SRC = "Phía Sau Một Cô Gái.mp3";
      // thử lần lượt: nguyên bản → NFD → NFC (tên file tiếng Việt có thể lệch mã Unicode)
      const SRC_TRIES = [
        MUSIC_SRC,
        MUSIC_SRC.normalize("NFD"),
        MUSIC_SRC.normalize("NFC"),
      ].map(encodeURI);
      let srcIdx = 0;
      bgm.src = SRC_TRIES[0];
      bgm.volume = 0.7;
      bgm.addEventListener("error", () => {
        console.error("Không tải được nhạc:", bgm.src);
        if (++srcIdx < SRC_TRIES.length) {
          bgm.src = SRC_TRIES[srcIdx];
          bgm.load();
        } else {
          $("hint").textContent = "⚠ Không tìm thấy file nhạc: " + MUSIC_SRC;
        }
      });
      let userPaused = false;
      const lbl = muteBtn.querySelector(".mlabel");
      function setMusicUI(playing) {
        muteBtn.classList.toggle("on", playing);
        muteBtn.classList.toggle("off", !playing && userPaused);
        lbl.textContent = playing ? "Đang phát" : userPaused ? "Đã tắt" : "Bật nhạc";
      }
      bgm.addEventListener("play", () => setMusicUI(true));
      bgm.addEventListener("pause", () => setMusicUI(false));
      setMusicUI(false);
      function playMusic() {
        if (userPaused) return;
        bgm.play().catch((err) => console.warn("Phát nhạc lỗi:", err));
      }
      // bấm nút: bật ↔ tắt nhạc
      muteBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
      muteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (bgm.paused) {
          userPaused = false;
          bgm.play().catch((err) => console.warn("Phát nhạc lỗi:", err));
        } else {
          userPaused = true;
          bgm.pause();
        }
      });
      // 🎵 Tự phát khi mở web. Nếu trình duyệt chặn, nhạc sẽ phát ngay
      // ở lần chạm / bấm phím / click đầu tiên của người xem.
      const unlockEvents = ["pointerdown", "touchstart", "keydown", "click"];
      function unlock() {
        if (userPaused) return;
        bgm
          .play()
          .then(() =>
            unlockEvents.forEach((ev) => removeEventListener(ev, unlock)),
          )
          .catch(() => {});
      }
      unlockEvents.forEach((ev) => addEventListener(ev, unlock));
      playMusic(); // thử phát ngay khi tải trang

      function decode() {
        if (decoding) return;
        decoding = true;
        playMusic();
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = (((f.rot % 360) + 540) % 360) - 180;
                f.state = "go";
                f.el.textContent = f.c;
              },
              600 + i++ * 160,
            );
          } else {
            setTimeout(
              () => {
                f.el.style.opacity = 0;
              },
              500 + R(0, 1500),
            );
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });
      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(init);

      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++)
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
      }
      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }
      const HEARTS = ["❤", "-`♡´-", "(❀❛ ֊ ❛„)♡", "ʕ•͡-•ʔ", "૮₍˃̵֊ ˂̵ ₎ა", "˃ᴗ˂", "( ๑ ˃̵ᴗ˂̵)و ♡", "ls"];
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(5, 11);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }
      function heartStorm() {
        for (let i = 0; i < 40; i++) setTimeout(heart, i * 60);
      }

      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 280);
        heartStorm();
        let i = 0;
        setTimeout(function type() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) setTimeout(type, 40);
          else {
            document
              .querySelectorAll(".w")
              .forEach((w, k) =>
                setTimeout(() => w.classList.add("on"), k * 350),
              );
            setTimeout(() => $("quote").classList.add("on2"), 1700);
            setTimeout(() => $("sign").classList.add("on2"), 2500);
            setTimeout(() => ($("btns").style.opacity = 1), 3000);
          }
        }, 1200);
      }
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!decoding) decode();
          else heartStorm();
        }
      });
      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);
      let lt = 0;
      addEventListener("pointermove", (e) => {
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const n = performance.now();
        if (n - lt < 50) return;
        lt = n;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "•ﻌ•", "١٥٧٤♡", "ls"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1100);
      });
      document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
      $("card").addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          for (let i = 0; i < 6; i++)
            burst(e.clientX, e.clientY, rnd(HEARTS), 18);
        }
      });
      // 🤖 ROBOT + 5 THỬ THÁCH → rồi mới tới thông điệp
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const bt = $("bot"), sayEl = $("say"), eyes = $("eyes"), arena = $("arena"), ctl = $("ctl"), dotsEl = $("dots");
      let botDone = false;
      function face(m) { eyes.className = "eyes " + (m || ""); $("blush").style.opacity = m === "happy" ? 1 : 0; }
      function say(h, m) {
        if (botDone) return;
        sayEl.innerHTML = h;
        sayEl.classList.remove("in"); void sayEl.offsetWidth; sayEl.classList.add("in");
        face(m);
      }
      function setDot(n) { [...dotsEl.children].forEach((d, i) => (d.className = i < n ? "done" : i === n ? "cur" : "")); }
      function clearAll() { arena.innerHTML = ""; ctl.innerHTML = ""; }
      function ctlBtn(txt, fn) {
        const b = document.createElement("button");
        b.className = "gb"; b.textContent = txt; b.onclick = fn; ctl.appendChild(b); return b;
      }
      async function wish(n, h) {
        clearAll(); say(h + `<div class="wc">điều ước: ${n}/3</div>`, "love");
        heartStorm(); await sleep(4500);
      }
      function cStars() {
        return new Promise((res) => {
          let n = 6;
          say("Thử thách 1: bắt hết <b>6 ngôi sao</b> nè!");
          for (let i = 0; i < 6; i++) {
            const s = document.createElement("div");
            s.className = "gs"; s.textContent = "★";
            s.style.cssText += `left:${R(8, 84)}vw;top:${Math.random() < 0.5 ? R(9, 34) : R(70, 88)}vh;font-size:${R(36, 58)}px;animation-delay:${R(0, 2)}s`;
            s.onpointerdown = (e) => {
              if (s.dead) return; s.dead = 1; s.classList.add("pop");
              for (let k = 0; k < 4; k++) burst(e.clientX, e.clientY, "✦", 12);
              setTimeout(() => s.remove(), 300);
              if (--n === 0) res(); else say(`Còn ${n} ngôi sao nữa!`, "happy");
            };
            arena.appendChild(s);
          }
        });
      }
      function ask(q, opts, ok) {
        return new Promise((res) => {
          say(q); ctl.innerHTML = "";
          opts.forEach((o, i) => ctlBtn(o, () => {
            if (i === ok) { ctl.innerHTML = ""; res(); } else say("Hmm, chưa đúng rồi... thử lại nha 🥺", "sad");
          }));
        });
      }
      async function cQuiz() {
        await ask("Thử thách 2: đố cậu! Ngày 20/10 là ngày gì nhỉ?", ["Ngày Nhà giáo VN", "Ngày Phụ nữ Việt Nam", "Ngày Quốc tế Thiếu nhi"], 1);
        say("Đúng rồi! Câu cuối nha...", "happy"); await sleep(1200);
        await ask("Ai là người đã gửi lời chúc này cho các cậu?", ["Ông già Noel", "Một con robot lạ", "Dương"], 2);
      }
      async function cSimon() {
        say("Thử thách 3: nhớ thứ tự các ô sáng rồi bấm lại nha");
        ctl.innerHTML = '<div class="pads"></div>';
        const box = ctl.firstChild, pads = [];
        ["#ff6fae", "#6ee7ff", "#ffd9a8", "#b58cff"].forEach((c) => {
          const p = document.createElement("button"); p.className = "pad"; p.style.setProperty("--c", c);
          box.appendChild(p); pads.push(p);
        });
        const flash = async (i) => { pads[i].classList.add("lit"); await sleep(450); pads[i].classList.remove("lit"); await sleep(180); };
        for (const len of [2, 3, 4]) {
          const seq = Array.from({ length: len }, () => Math.floor(Math.random() * 4));
          let ok = false;
          while (!ok) {
            box.style.pointerEvents = "none"; say(`Nhìn kỹ nhé... (${len} ô)`); await sleep(700);
            for (const i of seq) await flash(i);
            say("Tới lượt cậu!"); box.style.pointerEvents = "auto";
            ok = await new Promise((res) => {
              let k = 0;
              pads.forEach((p, i) => (p.onclick = () => {
                if (i === seq[k]) { p.classList.add("lit"); setTimeout(() => p.classList.remove("lit"), 200); if (++k === len) res(true); }
                else res(false);
              }));
            });
            if (!ok) { say("Ối, nhầm rồi! Xem lại nha 🥺", "sad"); await sleep(1300); }
            else { say("Chuẩn luôn!", "happy"); await sleep(700); }
          }
        }
      }
      function cDodge() {
        return new Promise((res) => {
          let n = 5;
          say("Thử thách 4: bấm trúng cái nút <b>tinh nghịch</b> này 5 lần!");
          const b = document.createElement("button"); b.className = "gb run"; arena.appendChild(b);
          const mv = () => { b.style.left = R(8, 55) + "vw"; b.style.top = R(66, 88) + "vh"; b.textContent = `Bấm tớ đi 😜 (${n})`; };
          mv();
          b.onclick = () => { if (--n === 0) { res(); return; } say(`Được lắm, còn ${n} lần!`, "happy"); mv(); };
          b.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse" && Math.random() < 0.5) mv(); });
        });
      }
      function cHold() {
        return new Promise((res) => {
          say("Thử thách cuối: <b>giữ</b> nút để sạc trái tim cho tớ 🔋");
          ctl.innerHTML = '<div class="bar"><i></i></div>';
          const f = ctl.querySelector("i"), b = ctlBtn("Giữ để sạc 🔋", () => {});
          b.style.touchAction = "none"; b.style.userSelect = "none"; b.oncontextmenu = (e) => e.preventDefault();
          let t0 = 0, raf = 0, on = false, done = false;
          const loop = () => {
            const p = Math.min(1, (performance.now() - t0) / 2500); f.style.width = p * 100 + "%";
            if (p >= 1) { done = true; on = false; res(); } else raf = requestAnimationFrame(loop);
          };
          const stop = () => {
            if (!on || done) return; on = false; cancelAnimationFrame(raf); f.style.width = "0";
            say("Thả sớm rồi, giữ lại nha 🥺", "sad");
          };
          b.onpointerdown = () => { if (done) return; on = true; t0 = performance.now(); say("Sạc nào... đừng thả nha!", "happy"); raf = requestAnimationFrame(loop); };
          ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, stop));
        });
      }
      function finish() {
        if (botDone) return; botDone = true;
        bt.classList.remove("show"); setTimeout(() => (bt.style.display = "none"), 900);
        showCard();
      }
      $("skip").onclick = finish;
      async function startBot() {
        if (botDone) return;
        $("stage").classList.add("hide"); bt.style.display = "flex";
        requestAnimationFrame(() => bt.classList.add("show"));
        setDot(0); face("");
        say("Khoan đã! Tớ là robot của Dương 🤖<br>Muốn nhận thông điệp thì phải qua <b>5 thử thách</b> đã nha!");
        await sleep(3600);
        setDot(0); clearAll(); await cStars();
        say("Giỏi quá! Cậu bắt hết rồi, tim tớ ấm hẳn lên", "happy"); await sleep(2400);
        await wish(1, "Chúc các cậu thật nhiều <b>sức khỏe</b>, ăn ngon ngủ kỹ, không ốm vặt nha");
        setDot(1); clearAll(); await cQuiz();
        say("Cậu thông minh quá trời luôn!", "happy"); await sleep(2200);
        setDot(2); clearAll(); await cSimon();
        say("Trí nhớ siêu đỉnh! Tim tớ đập nhanh quá", "happy"); await sleep(2200);
        await wish(2, "Chúc các cậu luôn <b>vui vẻ</b> mỗi ngày, mệt thì cứ nghỉ, đã có tớ ở đây");
        setDot(3); clearAll(); await cDodge();
        say("Hức, bị cậu bắt được rồi 😆", "happy"); await sleep(2000);
        setDot(4); clearAll(); await cHold();
        say("Đầy pin rồi! Cảm ơn cậu nhiều lắm", "happy"); await sleep(1800);
        await wish(3, "Chúc các cậu luôn <b>xinh đẹp</b>, rạng rỡ và được yêu thương thật nhiều");
        clearAll(); say("Xong hết rồi! Giờ thì... thông điệp của Dương dành cho các cậu đây 💌", "love");
        await sleep(2800); finish();
      }
    </script>
    </body>
</html>
